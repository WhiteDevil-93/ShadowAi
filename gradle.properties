android.useAndroidX=true
kotlin.code.style=official

# Gradle JVM args - increase memory for release builds
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# Build stability on mixed Windows/WSL filesystems
# Keep single-use daemon behavior to reduce long-lived file handles.
org.gradle.daemon=false
# Avoid concurrent module/task execution that can trigger Windows file-lock races.
org.gradle.parallel=false
org.gradle.configureondemand=false
# Disable Gradle virtual file-system watching to reduce watcher lock contention.
org.gradle.vfs.watch=false
org.gradle.caching=true
ksp.incremental=false
# Avoid multiple Kotlin daemon sessions competing for the same intermediates.
kotlin.compiler.execution.strategy=in-process

# Java toolchain configuration
# Disabling hardcoded paths to allow automatic JDK discovery in Windows environments.
# These paths were WSL/Linux specific and caused build failures on Windows.
org.gradle.java.installations.auto-download=true
# org.gradle.java.installations.paths=/home/anon3/.jdks/jdk-17,/home/anon3/.jdks/jdk-21
