name: Inventory

on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Java Version
        run: java -version > java_version.txt 2>&1

      - name: Gradle Version
        run: ./gradlew -v > gradle_version.txt 2>&1

      - name: Android SDK List
        run: ls -R $ANDROID_HOME/platforms > android_sdk.txt 2>&1

      - name: Validate Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inventory-logs
          path: |
            java_version.txt
            gradle_version.txt
            android_sdk.txt
